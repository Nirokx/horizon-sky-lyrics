[mod]
id = "sky_lyrics"
version = "1.0.0"
priority = 100

# Pinned: it draws inside the renderer's sky pass, which is not part of the
# stable hook points.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# Settings, timing, the music player, lyric lookup, glyphs, layout and the
# screen, free of game types.
[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client-render"

# The letters on the GPU and the state the hooks share.
[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "sky_lyrics"
source = "runtime.rs"
visibility = "pub"

# One per renderer: the device and the world's colour format.
[[injection]]
id = "stars_new"
kind = "HEAD"
target = "horizon_client_render::gfx::stars::Stars::new"
helper = "stars_new.rs"
bindings = [
  { name = "device", ty = "&wgpu::Device", value = "device" },
  { name = "format", ty = "wgpu::TextureFormat", value = "format" },
]

# Before the frame: the view and this frame's letters.
[[injection]]
id = "render"
kind = "HEAD"
target = "horizon_client_render::gfx::Renderer::render"
helper = "render.rs"
bindings = [
  { name = "renderer", ty = "&Renderer", value = "&*self" },
  { name = "frame", ty = "&Frame<'_>", value = "frame" },
]

# After the sun and moon, before the terrain: the stars' place in the sky pass.
[[injection]]
id = "stars_draw"
kind = "HEAD"
target = "horizon_client_render::gfx::stars::Stars::draw"
helper = "stars_draw.rs"
bindings = [
  { name = "pass", ty = "&mut wgpu::RenderPass<'_>", value = "&mut *pass" },
]

# The sky pass only reaches the stars when there are some, so by day there are
# some at no brightness.
[[injection]]
id = "celestial"
kind = "RETURN"
target = "horizon_client::game::Game<'_>::celestial_geometry"
helper = "celestial.rs"
bindings = [
  { name = "value", ty = "(Vec<Vertex>, Option<(glam::Mat4, f32)>)", value = "$value" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
